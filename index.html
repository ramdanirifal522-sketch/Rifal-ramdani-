<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifal Ramdani - X TJKT 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#009EE0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:500px;height:500px;background:white;border-radius:50%;top:-150px;left:-150px;opacity:0.15}
body::after{content:'';position:absolute;width:400px;height:400px;background:#FFD400;border-radius:50%;bottom:-100px;right:-100px;opacity:0.9}
.card{background:white;width:100%;max-width:380px;border-radius:30px;padding:25px;border:6px solid #1a1a1a;box-shadow:10px 10px 0px #1a1a1a;position:relative;z-index:2;text-align:center}
.bell{width:65px;height:65px;background:#FFD400;border:4px solid #1a1a1a;border-radius:50%;margin:-58px auto 15px;display:flex;justify-content:center;align-items:center;position:relative;box-shadow:0 4px 0 #1a1a1a}
.bell::after{content:'';width:18px;height:10px;background:#1a1a1a;border-radius:0 0 50px 50px;position:absolute;bottom:12px}
.bell-dot{width:10px;height:10px;background:#1a1a1a;border-radius:50%;margin-bottom:10px}
.pocket{position:absolute;top:20px;right:20px;font-size:28px;animation:bounce 2s infinite}
h1{font-size:28px;color:#009EE0;-webkit-text-stroke:1px #1a1a1a}
.nim{color:white;background:#1a1a1a;display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;margin:8px 0 18px;letter-spacing:1px}
.info-box{background:#E6F7FF;border:3px solid #1a1a1a;border-radius:20px;padding:5px 15px;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 5px;border-bottom:2.5px dashed #B3DFF5}
.row:last-child{border:none}
.label{color:#009EE0;font-weight:600;font-size:14px}
.value{font-weight:700;color:#1a1a1a;font-size:15px}
.tag{margin-top:18px;background:#FFD400;border:3px solid #1a1a1a;padding:10px;border-radius:12px;font-weight:700;transform:rotate(-1deg)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.footer{margin-top:15px;font-size:12px;color:#666}
</style>
</head>
<body>
<div class="card">
<div class="bell"><div class="bell-dot"></div></div>
<div class="pocket">🔵</div>
<h1>RIFAL RAMDANI</h1>
<div class="nim">X TJKT 1 • SMK BANJAR ASRI</div>

<div class="info-box">
<div class="row"><span class="label">🙋 Nama</span><span class="value">Rifal Ramdani</span></div>
<div class="row"><span class="label">🎂 Umur</span><span class="value">16 Tahun</span></div>
<div class="row"><span class="label">🧒 Gender</span><span class="value">Laki-laki</span></div>
<div class="row"><span class="label">🏫 Sekolah</span><span class="value">SMK BANJAR ASRI</span></div>
<div class="row"><span class="label">💻 Kelas</span><span class="value">X TJKT 1</span></div>
</div>

<div class="tag">✨ Website Kantong Ajaib ✨</div>
<div class="footer">dibuat dengan cinta ala Doraemon</div>
</div>
</body>
</html>
